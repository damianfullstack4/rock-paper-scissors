<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./stylesheet.css">
    <script src="./javascript.js" defer></script>
    <title>Rock Paper Scissors</title>
</head>
<body>
    <div class="container header">
        <h1>Rock Paper Scissors</h1>
        <h2>Human Vs. Computer</h2>
        <h3>First to five wins</h3>
    </div>

    <div class="container card">
        <span class="humanName">Human Score: <span class="humanScore">0</span></span>
        <span>Vs</span>
        <span class="computerName">Computer Score: <span class="computerScore">0</span></span>
    </div>

    <div class="container index">
        <span>Round: </span><span class="round">1</span>
    </div>

    <div class="container log">
    </div>

    <div class="container choice">
        <button>Rock</button>
        <button>Paper</button>
        <button>Scissors</button>
    </div>

    <div class="container final">
        <h1 class="message"></h1>
    </div>
</body>
</html>
